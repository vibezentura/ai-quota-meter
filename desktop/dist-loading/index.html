<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI Quota Meter</title>
<style>
  /* This page lives on the app's own tauri:// origin, so it cannot read the
     theme the dashboard stored under its http://127.0.0.1 origin. The OS
     preference is the best available guess, and it is enough to stop a
     light-mode user seeing a dark flash for the second before the real
     dashboard loads. */
  :root { color-scheme: dark light; --loading-bg: #090d13; --loading-fg: #8d99a8; --loading-track: rgba(255, 255, 255, 0.08); }
  @media (prefers-color-scheme: light) {
    :root { --loading-bg: #f3f5f8; --loading-fg: #5b6775; --loading-track: rgba(9, 13, 19, 0.1); }
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--loading-bg);
    color: var(--loading-fg);
    display: flex;
    align-items: center;
    justify-content: center;
    font: 13px "Segoe UI", sans-serif;
  }
  .ring {
    width: 40px; height: 40px; margin-bottom: 14px;
    border-radius: 50%;
    border: 3px solid var(--loading-track);
    border-top-color: #38cf9a;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wrap { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <!--
    Shown for the brief moment between the window appearing and the sidecar
    server answering its first health check (main.rs navigates this same
    window to the real dashboard once that happens). This file is the only
    thing Tauri's bundler embeds as the app's "frontend" — everything the
    user actually interacts with is served by the sidecar over HTTP.
  -->
  <div class="wrap">
    <div class="ring"></div>
    <div>Starting AI Quota Meter…</div>
  </div>
</body>
</html>
