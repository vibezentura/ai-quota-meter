name: Release

# Fires on a version tag (v0.1.0, v0.2.0, ...). Push a tag to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # SignPath's action reads this job's details and downloads the uploaded
  # artifact with GITHUB_TOKEN.
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Build single-file executable
        run: node build-exe.mjs

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: cmd
        # /D can't survive PowerShell's own argument quoting reliably; cmd
        # passes it through to ISCC untouched.
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ai-quota-meter.iss /DMyAppVersion=${{ steps.version.outputs.value }}'

      # windows-latest already ships the MSVC C++ build tools Rust needs to
      # link on Windows — only the Rust toolchain itself is missing.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install desktop shell dependencies
        working-directory: desktop
        run: npm install

      - name: Build desktop app installer
        working-directory: desktop
        run: npm run build

      - name: Locate desktop installer
        # The NSIS output filename has a space in it ("AI Quota Meter_<version>_x64-setup.exe"),
        # awkward to carry through further shell steps — copy it into dist/
        # alongside the other release artifacts under a predictable name.
        shell: bash
        run: |
          cp "desktop/src-tauri/target/release/bundle/nsis/AI Quota Meter_${{ steps.version.outputs.value }}_x64-setup.exe" \
             "dist/ai-quota-meter-desktop-setup-${{ steps.version.outputs.value }}.exe"

      # Code signing through SignPath Foundation (see CODE_SIGNING.md). Every
      # signing step is skipped until the repository variable
      # SIGNPATH_ORGANIZATION_ID is set, so releases publish unsigned until the
      # SignPath project exists. Needs variables SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG and secret
      # SIGNPATH_API_TOKEN.
      - name: Stage release executables for signing
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        # Fixed names so .signpath/artifact-configuration.xml can list exact
        # paths; the versioned names are restored after signing.
        shell: bash
        run: |
          mkdir -p dist/to-sign
          cp dist/ai-quota-meter.exe dist/to-sign/ai-quota-meter.exe
          cp "dist/ai-quota-meter-setup-${{ steps.version.outputs.value }}.exe" dist/to-sign/ai-quota-meter-setup.exe
          cp "dist/ai-quota-meter-desktop-setup-${{ steps.version.outputs.value }}.exe" dist/to-sign/ai-quota-meter-desktop-setup.exe

      - name: Upload unsigned executables
        id: upload-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-executables
          path: dist/to-sign/
          if-no-files-found: error

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: SignPath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.value }}"
          # Each request waits for a person to approve it in SignPath, so allow
          # hours rather than the 10-minute default.
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: dist/signed

      - name: Verify signatures and restore release names
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $names = [ordered]@{
            "ai-quota-meter.exe"               = "ai-quota-meter.exe"
            "ai-quota-meter-setup.exe"         = "ai-quota-meter-setup-$version.exe"
            "ai-quota-meter-desktop-setup.exe" = "ai-quota-meter-desktop-setup-$version.exe"
          }
          foreach ($signedName in $names.Keys) {
            $signature = Get-AuthenticodeSignature "dist/signed/$signedName"
            if ($signature.Status -ne "Valid") { throw "$signedName is not validly signed: $($signature.Status)" }
            Write-Host "$signedName signed by $($signature.SignerCertificate.Subject)"
            Copy-Item "dist/signed/$signedName" "dist/$($names[$signedName])" -Force
          }

      - name: Release notes signing line
        id: signing
        shell: bash
        run: |
          if [ -n "${{ vars.SIGNPATH_ORGANIZATION_ID }}" ]; then
            echo 'line=**All builds are code-signed by SignPath Foundation.** Windows may still show a SmartScreen prompt for a new release until it builds download reputation; the prompt names the verified publisher. See [CODE_SIGNING.md](https://github.com/${{ github.repository }}/blob/main/CODE_SIGNING.md).' >> "$GITHUB_OUTPUT"
          else
            echo 'line=**All builds are unsigned.** Windows SmartScreen will show "Windows protected your PC" — select **More info**, then **Run anyway**.' >> "$GITHUB_OUTPUT"
          fi

      # Runs after signing: signing changes each file's bytes, so the hashes
      # must describe the signed files that are actually published.
      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum ai-quota-meter.exe "ai-quota-meter-setup-${{ steps.version.outputs.value }}.exe" "ai-quota-meter-desktop-setup-${{ steps.version.outputs.value }}.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ai-quota-meter.exe
            dist/ai-quota-meter-setup-${{ steps.version.outputs.value }}.exe
            dist/ai-quota-meter-desktop-setup-${{ steps.version.outputs.value }}.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ${{ steps.signing.outputs.line }} Verify a download against `SHA256SUMS.txt`
            if you want to confirm it matches this build before running it.

            - **`ai-quota-meter-desktop-setup-${{ steps.version.outputs.value }}.exe`** (recommended) —
              native app: its own window, a tray icon, minimizes instead of quitting. Same dashboard,
              same local vault, same connectors — just not in a browser tab.
            - **`ai-quota-meter-setup-${{ steps.version.outputs.value }}.exe`** — the browser-based installer:
              Start Menu shortcut and uninstaller, but opens in your default browser.
            - **`ai-quota-meter.exe`** — portable, no install, opens in your browser.

            None of these need a separate Node.js install. See [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md)
            for the threat model.
